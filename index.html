<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>星塵榜</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070B1C;--line:rgba(255,255,255,.10);--ink:#EEF2FF;--dim:#8C97B8;
  --stone:#8A94A6;--gold:#FFC53D;--violet:#A855F7;--cyan:#22D3EE;--legend:#FF4D8D;
  --plus:#4ADE80;--minus:#FB7185;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:
    radial-gradient(1200px 700px at 15% -10%,#1B2455 0%,transparent 60%),
    radial-gradient(900px 600px at 90% 110%,#2A1240 0%,transparent 60%),var(--bg);
  color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif;
  overflow:hidden;user-select:none;-webkit-tap-highlight-color:transparent}
#stars{position:fixed;inset:0;pointer-events:none;opacity:.55}
#stars i{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;
  animation:twinkle 4s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.9}}

header{display:flex;align-items:center;gap:18px;padding:10px 18px;
  border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.04),transparent)}
.brand{display:flex;align-items:baseline;gap:12px}
.brand h1{font-size:24px;font-weight:900;letter-spacing:3px}
.brand small{font-family:"Chakra Petch",monospace;color:var(--dim);letter-spacing:3px;font-size:12px}
nav{display:flex;gap:10px;margin-left:auto}
.tab{font-size:19px;font-weight:900;padding:10px 28px;border-radius:14px;cursor:pointer;
  background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--dim);transition:.18s}
.tab.on{background:linear-gradient(135deg,#FFC53D,#FF8A3D);color:#241500;border-color:transparent;
  box-shadow:0 6px 24px rgba(255,180,60,.35)}
.mini{font-size:13px;padding:9px 12px;border-radius:10px;background:rgba(255,255,255,.05);
  border:1px solid var(--line);color:var(--dim);cursor:pointer;font-family:"Chakra Petch",monospace}
.mini.on{color:var(--gold);border-color:rgba(255,197,61,.5)}
.tools{display:flex;gap:8px;margin-left:12px}

main{height:calc(100vh - 61px);padding:10px}
.page{display:none;height:100%}
.page.on{display:block}

/* ===== 卡片 ===== */
#grid{height:100%;display:grid;gap:10px;align-content:stretch}
.card{position:relative;border-radius:22px;overflow:hidden;cursor:pointer;
  background:linear-gradient(165deg,#141B3D,#0B1029);
  border:2px solid rgba(255,255,255,.10);min-height:0;min-width:0;
  transition:transform .3s cubic-bezier(.2,1.4,.4,1)}
.body{position:relative;z-index:6;height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;padding:10px 8px 14px}
.name{font-size:clamp(16px,2.2vh,24px);font-weight:900;letter-spacing:1px;white-space:nowrap;margin-top:4px}
.pts{font-family:"Chakra Petch",monospace;font-weight:700;font-size:clamp(28px,4.6vh,50px);
  line-height:1.05;color:var(--tc);text-shadow:0 0 22px color-mix(in srgb,var(--tc) 60%,transparent)}
.meta{font-size:12px;letter-spacing:2px;color:var(--tc);opacity:.95;font-weight:700}
.meta b{color:var(--dim);font-weight:500;letter-spacing:0}
.goal{font-size:11px;color:var(--dim);margin-top:4px}
.bar{position:absolute;left:0;bottom:0;width:100%;height:4px;background:rgba(255,255,255,.07);z-index:6}
.bar i{display:block;height:100%;background:var(--tc);box-shadow:0 0 12px var(--tc);transition:width .6s}

/* 頭像：圖片填滿整個圓框 */
.avwrap{position:relative;width:clamp(58px,7.8vh,94px);height:clamp(58px,7.8vh,94px);
  display:grid;place-items:center;border-radius:50%;overflow:hidden;flex:0 0 auto;
  border:2px solid color-mix(in srgb,var(--tc) 60%,transparent);
  box-shadow:0 0 16px color-mix(in srgb,var(--tc) 35%,transparent)}
.av-emo{font-size:clamp(32px,4.6vh,56px);line-height:1}
.av-img{width:100%;height:100%;object-fit:cover;display:block}

.t0{--tc:var(--stone)}
.t1{--tc:var(--gold);border-color:rgba(255,197,61,.55);animation:breathe 3.4s ease-in-out infinite}
@keyframes breathe{
  0%,100%{box-shadow:0 0 0 1px rgba(255,197,61,.2),0 0 30px rgba(255,197,61,.12) inset}
  50%{box-shadow:0 0 0 1px rgba(255,197,61,.5),0 0 50px rgba(255,197,61,.3) inset,0 0 26px rgba(255,197,61,.25)}}
.t2{--tc:var(--violet);border-color:transparent}
.t3{--tc:var(--cyan);border-color:transparent}
.t4{--tc:var(--legend);border-color:transparent;box-shadow:0 0 44px rgba(255,77,141,.30)}

.halo{display:none;position:absolute;inset:-60%;z-index:0;pointer-events:none}
.t2 .halo,.t3 .halo,.t4 .halo{display:block}
.halo::before{content:"";position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg,#A855F7,#22D3EE,#FF4D8D,#FFC53D,#A855F7);
  filter:blur(26px);opacity:.30;animation:spin 7s linear infinite}
.t3 .halo::before{animation-duration:5s;opacity:.34}
.t4 .halo::before{animation-duration:3.6s;opacity:.40}
@keyframes spin{to{transform:rotate(360deg)}}

.ring{display:none;position:absolute;inset:0;border-radius:22px;padding:2px;z-index:5;pointer-events:none;
  background:conic-gradient(from 0deg,#FF4D8D,#FFC53D,#4ADE80,#22D3EE,#A855F7,#FF4D8D);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;animation:hue 4s linear infinite}
.t2 .ring,.t3 .ring,.t4 .ring{display:block}
@keyframes hue{to{filter:hue-rotate(360deg)}}

.pc{display:none;position:absolute;inset:0;overflow:hidden;z-index:2;pointer-events:none}
.t3 .pc,.t4 .pc{display:block}
.pc i{position:absolute;bottom:-8px;width:5px;height:5px;border-radius:50%;background:var(--tc);
  box-shadow:0 0 10px var(--tc);animation:rise 3.2s linear infinite}
@keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}
  15%{opacity:1}100%{transform:translateY(-200px) scale(1.2);opacity:0}}

.t4 .name{background:linear-gradient(90deg,#fff,#FFC53D,#FF4D8D,#22D3EE,#fff);
  background-size:300% 100%;-webkit-background-clip:text;background-clip:text;
  color:transparent;animation:flow 3s linear infinite}
@keyframes flow{to{background-position:300% 0}}
.scan{display:none;position:absolute;left:0;right:0;top:0;height:32%;z-index:5;pointer-events:none;
  background:linear-gradient(180deg,transparent,rgba(255,255,255,.16),transparent);
  animation:sweepy 3.2s ease-in-out infinite}
.t4 .scan{display:block}
@keyframes sweepy{0%{transform:translateY(-120%)}60%,100%{transform:translateY(420%)}}

.fx{position:absolute;inset:0;z-index:9;pointer-events:none;overflow:hidden}
.card.hit{transform:scale(1.07)}
.float{position:absolute;left:50%;top:38%;font-family:"Chakra Petch",monospace;font-weight:700;
  font-size:clamp(34px,5vh,54px);animation:fly 1.5s ease-out forwards;text-shadow:0 0 18px currentColor}
@keyframes fly{0%{opacity:0;transform:translate(-50%,20px) scale(.6)}
  20%{opacity:1;transform:translate(-50%,0) scale(1.15)}
  100%{opacity:0;transform:translate(-50%,-90px) scale(1)}}
.flash{position:absolute;inset:0;z-index:8;background:#fff;opacity:0;pointer-events:none}
.card.lv .flash{animation:bang .7s ease-out}
@keyframes bang{0%{opacity:0}8%{opacity:.85}100%{opacity:0}}
.wave{position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px;border-radius:50%;
  border:3px solid var(--tc);opacity:0;z-index:8;pointer-events:none}
.card.lv .wave{animation:wave 1.1s ease-out}
@keyframes wave{0%{opacity:.95;transform:scale(.4)}100%{opacity:0;transform:scale(16)}}

/* ===== 學生詳細 ===== */
#stuModal{position:fixed;inset:0;z-index:110;display:none;place-items:center;padding:26px;
  background:radial-gradient(circle,rgba(6,10,28,.82),rgba(0,0,0,.94));backdrop-filter:blur(5px)}
#stuModal.on{display:grid;animation:fadein .25s}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.sbox{width:min(1000px,94vw);max-height:88vh;overflow-y:auto;background:#0C1230;
  border:1px solid var(--line);border-radius:26px;padding:26px 28px 30px;
  animation:pop .4s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.shead{display:flex;align-items:center;gap:18px;margin-bottom:14px}
.shead .sav{width:88px;height:88px;border-radius:50%;overflow:hidden;display:grid;place-items:center;
  border:3px solid var(--tc);box-shadow:0 0 24px color-mix(in srgb,var(--tc) 45%,transparent);flex:0 0 auto}
.shead .sav img{width:100%;height:100%;object-fit:cover}
.shead .sav span{font-size:48px}
.snm{font-size:34px;font-weight:900;line-height:1.15}
.ssub{font-size:15px;color:var(--dim);margin-top:4px}
.ssub b{color:var(--tc)}
.sw{margin-left:auto;text-align:right}
.sw i{display:block;font-style:normal;font-size:12px;color:var(--dim);letter-spacing:2px}
.sw em{font-style:normal;font-family:"Chakra Petch",monospace;font-weight:700;font-size:42px;color:var(--gold)}
.sclose{margin-left:16px;padding:12px 20px;border:1px solid var(--line);border-radius:13px;
  background:rgba(255,255,255,.06);color:var(--ink);font-family:inherit;font-weight:900;
  font-size:16px;cursor:pointer;flex:0 0 auto}
.sh3{font-size:13px;letter-spacing:3px;color:var(--dim);font-weight:700;
  margin:20px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.avgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
.avpick2{position:relative;background:#111838;border:2px solid var(--line);border-radius:16px;
  padding:8px;text-align:center;cursor:pointer;transition:.15s}
.avpick2:active{transform:scale(.95)}
.avpick2.eq{border-color:var(--gold);box-shadow:0 0 20px rgba(255,197,61,.3)}
.avpick2 img{width:100%;aspect-ratio:1;border-radius:50%;object-fit:cover;display:block}
.avpick2 .em{font-size:46px;line-height:1.5}
.avpick2 .eqtag{position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:var(--gold);
  color:#241500;font-size:11px;font-weight:900;padding:2px 10px;border-radius:20px;white-space:nowrap}
.hist{display:grid;gap:22px;grid-template-columns:1fr 1fr}
.hcol h4{font-size:15px;font-weight:900;margin-bottom:10px}
.hrow{display:flex;align-items:center;gap:10px;background:#111838;border:1px solid var(--line);
  border-radius:12px;padding:11px 13px;margin-bottom:7px;font-size:15px}
.hrow .hi{font-size:22px;flex:0 0 auto}
.hrow .ht{flex:1;min-width:0}
.hrow .hd{font-family:"Chakra Petch",monospace;font-weight:700;color:var(--gold);flex:0 0 auto}
.hrow .hw{font-size:11px;color:var(--dim);flex:0 0 auto}
.hnone{color:var(--dim);font-size:14px;padding:14px 2px}
@media (max-width:760px){.hist{grid-template-columns:1fr}}

/* ===== 商店 ===== */
#shopWrap{height:100%;overflow-y:auto;padding-right:6px}
#shopGrid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.item{background:linear-gradient(165deg,#141B3D,#0B1029);border:1px solid var(--line);
  border-radius:20px;padding:18px;text-align:center;position:relative;overflow:hidden}
.item.av{border-color:rgba(168,85,247,.5);box-shadow:0 0 30px rgba(168,85,247,.14) inset}
.item .ico{font-size:52px;line-height:1.1}
.item .ico img{width:96px;height:96px;border-radius:50%;object-fit:cover;border:2px solid var(--violet)}
.item .nm{font-size:21px;font-weight:900;margin-top:6px}
.item .kind{font-size:11px;letter-spacing:2px;color:var(--violet);font-weight:700}
.item .pr{font-family:"Chakra Petch",monospace;font-size:29px;font-weight:700;color:var(--gold);margin-top:6px}
.item .st{font-size:13px;color:var(--dim);margin-top:2px}
.item.out{filter:grayscale(1);opacity:.4}
.item.out::after{content:"售完";position:absolute;top:12px;right:14px;font-size:18px;font-weight:900;color:var(--minus)}
.empty{color:var(--dim);text-align:center;padding:70px 0;font-size:20px;grid-column:1/-1}

/* ===== 轉盤 ===== */
#wheelWrap{position:fixed;inset:0;z-index:120;display:none;place-items:center;
  background:radial-gradient(circle,rgba(6,10,28,.80),rgba(0,0,0,.94));backdrop-filter:blur(5px)}
#wheelWrap.on{display:grid;animation:fadein .35s}
.wbox{text-align:center;animation:pop .55s cubic-bezier(.2,1.55,.4,1)}
.wtag{font-family:"Chakra Petch",monospace;letter-spacing:12px;color:var(--gold);font-size:17px}
.wwho{font-size:clamp(26px,4.2vh,44px);font-weight:900;margin:4px 0 14px}
.wwho b{background:linear-gradient(90deg,#FFC53D,#FF4D8D,#22D3EE);background-size:200%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 2.4s linear infinite}
.wstage{position:relative;width:min(54vh,54vw);height:min(54vh,54vw);margin:0 auto}
.wheel{position:absolute;inset:0;border-radius:50%;border:6px solid rgba(255,255,255,.14);
  box-shadow:0 0 50px rgba(168,85,247,.4),inset 0 0 40px rgba(0,0,0,.55);
  transition:transform 4.6s cubic-bezier(.12,.82,.16,1);cursor:pointer}
.wlab{position:absolute;inset:0;display:flex;justify-content:center;pointer-events:none}
.wlab span{margin-top:7%;font-size:clamp(13px,1.9vh,20px);font-weight:900;color:#0B0E22;
  text-shadow:0 1px 2px rgba(255,255,255,.45);max-width:6.5em;line-height:1.25;text-align:center}
.wlab span i{display:block;font-size:1.5em;font-style:normal}
.wptr{position:absolute;top:-16px;left:50%;transform:translateX(-50%);z-index:5;width:0;height:0;
  border-left:19px solid transparent;border-right:19px solid transparent;
  border-top:34px solid var(--gold);filter:drop-shadow(0 3px 8px rgba(0,0,0,.7))}
.whub{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:4;
  width:20%;height:20%;border-radius:50%;display:grid;place-items:center;cursor:pointer;
  background:linear-gradient(160deg,#1B2350,#0B1029);border:3px solid var(--gold);
  font-weight:900;font-size:clamp(15px,2.2vh,24px);color:var(--gold);
  box-shadow:0 0 26px rgba(255,197,61,.5);animation:hub 1.4s ease-in-out infinite}
@keyframes hub{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.09)}}
.whub.off{animation:none;cursor:default;opacity:.65}
.wres{min-height:60px;margin-top:16px;font-size:clamp(20px,3.2vh,34px);font-weight:900;opacity:0;transition:.4s}
.wres.on{opacity:1}
.wres b{color:var(--gold)}
.wbtn{margin-top:4px;padding:14px 46px;border:0;border-radius:16px;font-size:20px;font-weight:900;
  font-family:inherit;background:linear-gradient(135deg,#FFC53D,#FF8A3D);color:#241500;cursor:pointer;
  opacity:0;pointer-events:none;transition:.3s}
.wbtn.on{opacity:1;pointer-events:auto}

body.lowfx .halo::before,body.lowfx .pc,body.lowfx .scan,body.lowfx #stars i,
body.lowfx .t1,body.lowfx .t4 .name,body.lowfx .ring{animation:none!important}
body.lowfx .pc{display:none!important}
body.lowfx .t4 .name{-webkit-text-fill-color:var(--ink);color:var(--ink)}
body.lowfx .ring{background:linear-gradient(135deg,#FF4D8D,#22D3EE)}
body.lowfx .halo{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
</style>
</head>
<body>
<div id="stars"></div>

<header>
  <div class="brand"><h1>星塵榜</h1><small>CLASS POINTS</small></div>
  <nav>
    <div class="tab on" data-p="board">學生榜</div>
    <div class="tab" data-p="shop">商店</div>
  </nav>
  <div class="tools">
    <div class="mini on" id="btnFx">特效 ON</div>
    <div class="mini on" id="btnSnd">音效 ON</div>
  </div>
</header>

<main>
  <section class="page on" id="p-board"><div id="grid"><div class="empty">連線中…</div></div></section>
  <section class="page" id="p-shop"><div id="shopWrap"><div id="shopGrid"></div></div></section>
</main>

<div id="stuModal"><div class="sbox" id="sbox">
  <div class="shead">
    <div class="sav" id="sAv"></div>
    <div><div class="snm" id="sNm"></div><div class="ssub" id="sSub"></div></div>
    <div class="sw"><i>可用點數</i><em id="sWal">0</em></div>
    <button class="sclose" id="sClose">關閉</button>
  </div>
  <div class="sh3">我的頭像 · 點一下就換</div>
  <div class="avgrid" id="sOwned"></div>
  <div class="sh3">紀錄</div>
  <div class="hist">
    <div class="hcol"><h4>🛒 買過的東西</h4><div id="sBuys"></div></div>
    <div class="hcol"><h4>🎡 轉盤抽到的</h4><div id="sSpins"></div></div>
  </div>
</div></div>

<div id="wheelWrap"><div class="wbox">
  <div class="wtag">LEVEL UP</div>
  <div class="wwho"><span id="wName"></span> 升級到 <b id="wTier"></b></div>
  <div class="wstage">
    <div class="wptr"></div><div class="wheel" id="wheel"></div><div class="whub" id="whub">轉</div>
  </div>
  <div class="wres" id="wRes"></div>
  <button class="wbtn" id="wTake">收下</button>
</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, onSnapshot, updateDoc, addDoc, getDocs, arrayUnion,
  query, orderBy, limit, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ===== 設定 ===== */
const firebaseConfig = {
  apiKey: "AIzaSyDrDK9sr3U1239BzbU7xMCc5QddYvCC34s",
  authDomain: "school-e429d.firebaseapp.com",
  projectId: "school-e429d",
  storageBucket: "school-e429d.firebasestorage.app",
  messagingSenderId: "881372767341",
  appId: "1:881372767341:web:b3b66c431594b5c4a94b64",
  measurementId: "G-B1DENGMX27"
};
const TIERS = [
  { key:0, min:0,   name:"見習", color:"#8A94A6" },
  { key:1, min:50,  name:"金輝", color:"#FFC53D" },
  { key:2, min:150, name:"紫耀", color:"#A855F7" },
  { key:3, min:250, name:"星焰", color:"#22D3EE" },
  { key:4, min:450, name:"傳說", color:"#FF4D8D" }
];
function tierOf(t){ let r = TIERS[0]; for (const x of TIERS) if ((t||0) >= x.min) r = x; return r; }
function nextTier(t){ for (const x of TIERS) if ((t||0) < x.min) return x; return null; }
const DEFAULT_WHEEL = [
  { label:"乖乖一包", emoji:"🍪", weight:5, points:0 },
  { label:"養樂多", emoji:"🥤", weight:5, points:0 },
  { label:"加 10 點", emoji:"💰", weight:4, points:10 },
  { label:"免寫作業一次", emoji:"📝", weight:2, points:0 },
  { label:"加 30 點", emoji:"💎", weight:2, points:30 },
  { label:"自選大零食", emoji:"🎁", weight:1, points:0 }
];
function isImg(v){
  const s = String(v||"").trim();
  return /^https?:\/\//.test(s) || s.startsWith("/") || s.startsWith("./")
      || /\.(png|jpe?g|webp|gif|svg|avif)$/i.test(s);
}
function avatarHTML(a){
  const v = String(a || "🙂").trim();
  return isImg(v) ? `<img class="av-img" src="${v}" alt="" loading="lazy">`
                  : `<span class="av-emo">${v}</span>`;
}
const esc = s => String(s ?? "").replace(/[<>&"]/g,
  c => ({ "<":"&lt;", ">":"&gt;", "&":"&amp;", '"':"&quot;" }[c]));

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);
const $ = id => document.getElementById(id);

/* 星星 */
const sw = $("stars");
for (let i = 0; i < 90; i++){
  const s = document.createElement("i");
  s.style.left = Math.random()*100 + "%"; s.style.top = Math.random()*100 + "%";
  s.style.animationDelay = (Math.random()*4) + "s";
  s.style.opacity = Math.random()*.8 + .2;
  sw.appendChild(s);
}

document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.remove("on"));
  document.querySelectorAll(".page").forEach(x => x.classList.remove("on"));
  t.classList.add("on"); $("p-" + t.dataset.p).classList.add("on");
});

let lowfx = localStorage.getItem("lowfx") === "1";
let snd   = localStorage.getItem("snd") !== "0";
function syncToggles(){
  document.body.classList.toggle("lowfx", lowfx);
  $("btnFx").textContent = lowfx ? "特效 OFF" : "特效 ON";
  $("btnFx").classList.toggle("on", !lowfx);
  $("btnSnd").textContent = snd ? "音效 ON" : "音效 OFF";
  $("btnSnd").classList.toggle("on", snd);
}
$("btnFx").onclick  = () => { lowfx = !lowfx; localStorage.setItem("lowfx", lowfx?"1":"0"); syncToggles(); };
$("btnSnd").onclick = () => { snd = !snd; localStorage.setItem("snd", snd?"1":"0"); syncToggles(); };
syncToggles();

let ac = null;
function tone(seq, type = "triangle", vol = .16){
  if (!snd) return;
  try{
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    seq.forEach(([f, at, dur]) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.value = f;
      const t = ac.currentTime + at;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + .02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + .02);
    });
  }catch(e){}
}
const sfxUp   = () => tone([[660,0,.22],[880,.09,.22],[1320,.18,.26]]);
const sfxDown = () => tone([[420,0,.2],[260,.09,.26]]);
const sfxLv   = () => tone([[523,0,.3],[659,.1,.3],[784,.2,.3],[1047,.3,.36],[1319,.42,.5]]);
const sfxTick = () => tone([[1400,0,.03]], "square", .05);
const sfxWin  = () => tone([[784,0,.25],[1047,.12,.25],[1319,.24,.3],[1568,.36,.55]]);

/* ===== 學生榜 ===== */
const grid = $("grid");
const nodes = new Map();
const prev = {}, byId = {};
const avatarItemByName = {};
let signature = "", firstPaint = true, lastN = 0;

function fitGrid(n){
  const W = grid.clientWidth, H = grid.clientHeight, gap = 10;
  if (!W || !H || !n) return;
  let best = null;
  for (let c = 1; c <= n; c++){
    const r = Math.ceil(n / c);
    const w = (W - gap*(c-1)) / c, h = (H - gap*(r-1)) / r;
    if (w < 130 || h < 105) continue;
    const score = Math.abs(w/h - 1.1) + (c*r - n) * 0.07;
    if (!best || score < best.score) best = { score, c, r };
  }
  if (!best){ const c = Math.ceil(Math.sqrt(n)); best = { c, r: Math.ceil(n/c) }; }
  grid.style.gridTemplateColumns = `repeat(${best.c},1fr)`;
  grid.style.gridTemplateRows    = `repeat(${best.r},1fr)`;
}
addEventListener("resize", () => fitGrid(lastN));

function shell(s){
  const parts = Array.from({length:6}, (_,i) =>
    `<i style="left:${8+i*15}%;animation-delay:${(i*0.5).toFixed(1)}s"></i>`).join("");
  const el = document.createElement("div");
  el.className = "card t0";
  el.dataset.id = s.id;
  el.innerHTML = `
    <div class="halo"></div><div class="pc">${parts}</div>
    <div class="scan"></div><div class="ring"></div>
    <div class="body">
      <div class="avwrap"><div class="avslot">${avatarHTML(s.avatar)}</div></div>
      <div class="name"></div><div class="pts"></div>
      <div class="meta"></div><div class="goal"></div>
    </div>
    <div class="bar"><i></i></div>
    <div class="flash"></div><div class="wave"></div><div class="fx"></div>`;
  el.addEventListener("click", () => openStudent(s.id));
  return el;
}

function paint(el, s){
  const total = s.total || 0, wallet = s.wallet || 0;
  const t = tierOf(total), nx = nextTier(total);
  let prog = 100, goal = "已達最高等級";
  if (nx){
    prog = Math.round((total - t.min) / (nx.min - t.min) * 100);
    goal = `離 ${nx.name} 還差 ${nx.min - total} 分`;
  }
  for (let k = 0; k < 5; k++) el.classList.remove("t" + k);
  el.classList.add("t" + t.key);
  el.querySelector(".name").textContent = s.name;
  el.querySelector(".pts").textContent  = wallet;
  el.querySelector(".meta").innerHTML   = `${t.name} <b>· 累積 ${total}</b>`;
  el.querySelector(".goal").textContent = goal;
  el.querySelector(".bar i").style.width = Math.max(0, Math.min(100, prog)) + "%";
  const slot = el.querySelector(".avslot"), want = avatarHTML(s.avatar);
  if (slot.innerHTML !== want) slot.innerHTML = want;
}

function popFloat(id, diff){
  const el = nodes.get(id); if (!el) return;
  const f = document.createElement("div");
  f.className = "float";
  f.textContent = (diff > 0 ? "+" : "") + diff;
  f.style.color = diff > 0 ? "var(--plus)" : "var(--minus)";
  f.style.transform = "translateX(-50%)";
  el.querySelector(".fx").appendChild(f);
  el.classList.add("hit");
  setTimeout(() => el.classList.remove("hit"), 320);
  setTimeout(() => f.remove(), 1600);
  diff > 0 ? sfxUp() : sfxDown();
}

function burst(id){
  const el = nodes.get(id); if (!el) return;
  el.classList.remove("lv"); void el.offsetWidth; el.classList.add("lv");
  sfxLv();
  setTimeout(() => el.classList.remove("lv"), 1300);
}

function startBoard(){
onSnapshot(collection(db, "students"), snap => {
  const list = snap.docs.map(d => ({ id: d.id, ...d.data() }))
    .sort((a,b) => String(a.name).localeCompare(String(b.name), "zh-Hant"));
  list.forEach(s => byId[s.id] = s);
  if (!list.length){
    grid.innerHTML = `<div class="empty">還沒有學生，去後台的「設定」新增</div>`;
    nodes.clear(); signature = ""; return;
  }
  const sig = list.map(s => s.id).join("|");
  if (sig !== signature){
    grid.innerHTML = ""; nodes.clear();
    list.forEach(s => { const el = shell(s); grid.appendChild(el); nodes.set(s.id, el); });
    signature = sig; lastN = list.length; fitGrid(lastN);
  }
  list.forEach(s => {
    const el = nodes.get(s.id); if (!el) return;
    paint(el, s);
    const p = prev[s.id], total = s.total || 0, wallet = s.wallet || 0;
    if (!firstPaint && p){
      if (p.wallet !== wallet) popFloat(s.id, wallet - p.wallet);
      if (tierOf(total).key > tierOf(p.total).key) burst(s.id);
    }
    prev[s.id] = { total, wallet };
  });
  firstPaint = false;
}, err => { grid.innerHTML = `<div class="empty">讀取失敗：${esc(err.message)}</div>`; });
}

/* ===== 學生詳細 ===== */
let logCache = [], logAt = 0;
async function loadLogs(){
  if (Date.now() - logAt < 20000 && logCache.length) return logCache;
  try{
    const snap = await getDocs(query(collection(db,"logs"), orderBy("at","desc"), limit(300)));
    logCache = snap.docs.map(d => d.data()); logAt = Date.now();
  }catch(e){ console.warn(e); }
  return logCache;
}
const when = ts => { try{ const d = ts.toDate(); return `${d.getMonth()+1}/${d.getDate()}`; }catch(e){ return ""; } };

async function openStudent(id){
  const s = byId[id]; if (!s) return;
  const t = tierOf(s.total || 0);
  $("sbox").style.setProperty("--tc", t.color);
  $("sAv").innerHTML = avatarHTML(s.avatar);
  $("sNm").textContent = s.name;
  $("sSub").innerHTML = `<b>${t.name}</b> · 累積 ${s.total || 0} 分`;
  $("sWal").textContent = s.wallet || 0;
  $("sOwned").innerHTML = `<div class="hnone">載入中…</div>`;
  $("sBuys").innerHTML = ""; $("sSpins").innerHTML = "";
  $("stuModal").classList.add("on");

  const mine = (await loadLogs()).filter(l => l.studentId === id);

  // owned 是後來才加的欄位，舊資料從購買紀錄反推回來
  const fromLogs = mine.filter(l => l.kind === "buy")
    .map(l => (String(l.reason || "").match(/兌換「(.+)」/) || [])[1])
    .map(nm => avatarItemByName[nm]).filter(Boolean);
  const owned = Array.from(new Set([...(s.owned || []), ...fromLogs, s.avatar].filter(Boolean)));
  const missing = owned.filter(a => !(s.owned || []).includes(a));
  if (missing.length)
    updateDoc(doc(db,"students",id), { owned: arrayUnion(...missing) }).catch(e => console.warn(e));

  $("sOwned").innerHTML = (owned.length <= 1 && !isImg(s.avatar))
    ? `<div class="hnone">還沒有買過頭像，去商店換一個吧</div>`
    : owned.map(a => {
        const eq = a === s.avatar;
        const inner = isImg(a) ? `<img src="${esc(a)}" alt="">` : `<div class="em">${a}</div>`;
        return `<div class="avpick2 ${eq?"eq":""}" data-av="${esc(a)}">
          ${eq ? `<div class="eqtag">使用中</div>` : ""}${inner}</div>`;
      }).join("");
  $("sOwned").querySelectorAll("[data-av]").forEach(el => el.onclick = async () => {
    const av = el.dataset.av;
    if (av === byId[id].avatar) return;
    try{ await updateDoc(doc(db,"students",id), { avatar: av }); sfxUp();
         setTimeout(() => openStudent(id), 350); }catch(e){ console.error(e); }
  });

  const row = l => `<div class="hrow">
      <div class="hi">${l.kind === "spin" ? "🎡" : "🛒"}</div>
      <div class="ht">${esc(String(l.reason || "").replace(/^轉盤（.*?）：/, ""))}</div>
      ${l.delta ? `<div class="hd">${l.delta > 0 ? "+" : ""}${l.delta}</div>` : ""}
      <div class="hw">${when(l.at)}</div></div>`;
  const buys  = mine.filter(l => l.kind === "buy");
  const spins = mine.filter(l => l.kind === "spin");
  $("sBuys").innerHTML  = buys.length  ? buys.map(row).join("")  : `<div class="hnone">還沒買過東西</div>`;
  $("sSpins").innerHTML = spins.length ? spins.map(row).join("") : `<div class="hnone">還沒轉過轉盤</div>`;
}
$("sClose").onclick = () => $("stuModal").classList.remove("on");
$("stuModal").onclick = e => { if (e.target.id === "stuModal") $("stuModal").classList.remove("on"); };

/* ===== 商店 ===== */
const shopGrid = $("shopGrid");
function startShop(){
onSnapshot(collection(db, "items"), snap => {
  const list = snap.docs.map(d => ({ id: d.id, ...d.data() }))
    .filter(i => i.active !== false).sort((a,b) => (a.price||0) - (b.price||0));
  list.forEach(i => { if (i.type === "avatar" && i.name) avatarItemByName[i.name] = i.emoji; });
  if (!list.length){ shopGrid.innerHTML = `<div class="empty">商店還沒上架東西</div>`; return; }
  shopGrid.innerHTML = list.map(i => {
    const isAv = i.type === "avatar";
    const out  = !isAv && (i.stock || 0) <= 0;
    const ico  = isImg(i.emoji) ? `<img src="${esc(i.emoji)}" alt="" loading="lazy">` : (i.emoji || "🎁");
    return `<div class="item ${isAv?"av":""} ${out?"out":""}">
      <div class="ico">${ico}</div><div class="nm">${esc(i.name)}</div>
      ${isAv ? `<div class="kind">頭像</div>` : ""}
      <div class="pr">${i.price || 0} 點</div>
      <div class="st">${isAv ? "換了就永久是你的" : `剩下 ${i.stock || 0} 個`}</div></div>`;
  }).join("");
}, err => { shopGrid.innerHTML = `<div class="empty">讀取失敗：${esc(err.message)}</div>`; });
}

/* ===== 轉盤 ===== */
const SEG_COLORS = ["#FFC53D","#A855F7","#22D3EE","#FF4D8D","#4ADE80","#FB923C","#60A5FA","#F472B6"];
let prizes = DEFAULT_WHEEL.slice();
let queue = [], current = null, spinning = false, landed = null;

function buildWheel(){
  const n = prizes.length, per = 360 / n;
  const stops = prizes.map((p,i) =>
    `${SEG_COLORS[i % SEG_COLORS.length]} ${(i*per).toFixed(3)}deg ${((i+1)*per).toFixed(3)}deg`).join(",");
  const labs = prizes.map((p,i) =>
    `<div class="wlab" style="transform:rotate(${(i*per + per/2).toFixed(3)}deg)">
       <span><i>${p.emoji || "🎁"}</i>${esc(p.label)}</span></div>`).join("");
  const w = $("wheel");
  w.style.transition = "none"; w.style.transform = "rotate(0deg)";
  w.style.background = `conic-gradient(from 0deg,${stops})`;
  w.innerHTML = labs; void w.offsetWidth;
}
function pickIndex(){
  const tot = prizes.reduce((a,p) => a + (Number(p.weight) > 0 ? Number(p.weight) : 1), 0);
  let r = Math.random() * tot;
  for (let i = 0; i < prizes.length; i++){
    r -= (Number(prizes[i].weight) > 0 ? Number(prizes[i].weight) : 1);
    if (r <= 0) return i;
  }
  return prizes.length - 1;
}
function showSpin(sp){
  current = sp; spinning = false; landed = null;
  $("wName").textContent = sp.studentName;
  $("wTier").textContent = sp.tierName;
  $("wRes").classList.remove("on"); $("wRes").innerHTML = "";
  $("wTake").classList.remove("on");
  $("whub").classList.remove("off"); $("whub").textContent = "轉";
  buildWheel(); $("wheelWrap").classList.add("on");
}
function doSpin(){
  if (spinning || !current) return;
  spinning = true;
  $("whub").classList.add("off"); $("whub").textContent = "…";
  const idx = pickIndex(), n = prizes.length, per = 360 / n;
  const centre = idx * per + per / 2;
  const jitter = (Math.random() - .5) * per * .6;
  const target = 360 * 6 + (360 - centre - jitter);
  const w = $("wheel");
  w.style.transition = "transform 4.6s cubic-bezier(.12,.82,.16,1)";
  w.style.transform = `rotate(${target.toFixed(2)}deg)`;
  let ticks = 0;
  const iv = setInterval(() => { sfxTick(); if (++ticks > 26) clearInterval(iv); }, 150);
  landed = prizes[idx];
  setTimeout(() => {
    clearInterval(iv);
    const bonus = Number(landed.points) > 0 ? `　<b>+${landed.points} 點</b>` : "";
    $("wRes").innerHTML = `${landed.emoji || "🎁"} 抽中 <b>${esc(landed.label)}</b>${bonus}`;
    $("wRes").classList.add("on"); $("wTake").classList.add("on"); sfxWin();
  }, 4700);
}
$("wheel").onclick = doSpin;
$("whub").onclick  = doSpin;

$("wTake").onclick = async () => {
  if (!current || !landed) return;
  const sp = current, pz = landed;
  $("wheelWrap").classList.remove("on");
  current = null; landed = null; spinning = false;
  try{
    await updateDoc(doc(db,"spins",sp.id), {
      status:"done", prize:pz.label, prizePoints:Number(pz.points)||0, doneAt:serverTimestamp() });
    const pts = Number(pz.points) || 0;
    if (pts > 0){
      const s = byId[sp.studentId];
      if (s) await updateDoc(doc(db,"students",sp.studentId), { wallet: (s.wallet||0) + pts });
    }
    await addDoc(collection(db,"logs"), {
      studentId:sp.studentId, studentName:sp.studentName, delta:pts,
      reason:`轉盤（${sp.tierName}）：${pz.label}`, kind:"spin", at:serverTimestamp() });
  }catch(e){ console.error(e); }
  logAt = 0;
  setTimeout(() => { if (!current && queue.length) showSpin(queue[0]); }, 600);
};

function startSpins(){
  onSnapshot(doc(db,"config","wheel"), d => {
    const v = d.exists() ? d.data().prizes : null;
    if (Array.isArray(v) && v.length) prizes = v;
    if (current && !spinning) buildWheel();
  }, e => console.warn(e));
  onSnapshot(query(collection(db,"spins"), orderBy("at","asc"), limit(20)), snap => {
    queue = snap.docs.map(d => ({ id:d.id, ...d.data() })).filter(s => s.status === "pending");
    if (!current && queue.length) showSpin(queue[0]);
  }, e => console.warn(e));
}

/* 開場量一下幀率，撐不住就自動降特效（可以再手動開回來） */
(function watchFPS(){
  if (lowfx) return;
  let frames = 0, t0 = performance.now();
  function tick(){
    frames++;
    const dt = performance.now() - t0;
    if (dt < 2500) return requestAnimationFrame(tick);
    const fps = frames / (dt / 1000);
    if (fps < 40 && localStorage.getItem("lowfx") === null){
      lowfx = true; syncToggles();
      console.log("幀率偏低（" + fps.toFixed(0) + " fps），已自動關閉特效");
    }
  }
  setTimeout(() => requestAnimationFrame(tick), 1500);
})();

signInAnonymously(getAuth(app))
  .then(() => { startBoard(); startShop(); startSpins(); })
  .catch(e => {
    grid.innerHTML = `<div class="empty">登入失敗：${esc(e.code)}<br>
      <span style="font-size:15px">Firebase Console → Authentication → 啟用「匿名」</span></div>`;
  });
</script>
